name = "synthomnicon-lean"
version = "0.1.0"
keywords = ["math"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "SynthOmnicon"
root = "SynthOmnicon"
globs = [
  "SynthOmnicon.Primitives.Core",
  "SynthOmnicon.Primitives.OPN_2adic",
  "SynthOmnicon.Primitives.BSD_2adic",
  "SynthOmnicon.Primitives.Synthon",
  "SynthOmnicon.Primitives.TierCrossing",
  "SynthOmnicon.Primitives.Crystal",
  "SynthOmnicon.Primitives.Catalog",
  "SynthOmnicon.Consciousness",
  "SynthOmnicon.AgentSelf",
  "SynthOmnicon.Algebra",
  "SynthOmnicon.Millennium.RH",
  "SynthOmnicon.Millennium.YM",
  "SynthOmnicon.Millennium.Hodge",
  "SynthOmnicon.Millennium.NS",
  "SynthOmnicon.Millennium.PvsNP",
  "SynthOmnicon.Millennium.OPN",
  "SynthOmnicon.Millennium.BSD",
  "SynthOmnicon.Millennium.Barriers",
  "SynthOmnicon.Millennium.PrimitiveBridge",
  "SynthOmnicon.Millennium.FrobeniusStructure",
  "SynthOmnicon.Millennium.E8G2_Vessel",
  "SynthOmnicon.Millennium.E8G2_Vessel_Proofs",
  "SynthOmnicon.Classical.Solitary10",
  "SynthOmnicon.Classical.HeckeLandau",
  "SynthOmnicon.Basic",
  "SynthOmnicon.Millennium.PrimitiveConventionalBridge",
  "SynthOmnicon.Millennium.PerfectCuboid"
]
